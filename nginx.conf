server {
    listen ${NGINX_PORT};

    root /var/www/html;
    index index.html;

    # nginx sits behind a reverse proxy (Caddy) and must not leak its
    # internal port into Location headers.
    absolute_redirect off;

    # SPA fallback. HTML is never cached so deploys propagate immediately;
    # security headers repeated per location because nginx add_header does
    # not inherit once a location defines its own.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    # Hashed build assets: cache forever
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }
}
