# Каталог вставляемых сниппетов regex (см. src/content/README.md, ADR-0009).
# Поля: group, pattern, desc, trigger, example, gotcha, kind = "default" | "alt".
# pattern — литеральная строка ('...'): regex дословно, без экранирования бэкслэшей.
# Легаси-паттерны («не копировать») сюда НЕ добавляем.

# ─── Денежные суммы операции (income/outcome/fee/cashback/op_*) ───

[[snippet]]
group = "amount"
kind = "default"
pattern = '(\d[\d\s.,]*)'
desc = "Сумма: начинается с цифры, дальше цифры, пробелы, точки и запятые. Ловит и целые (1000), и дробные (1000.00, 1 000,00)."
trigger = "Когда сумма может быть без копеек."
example = "+2,674,000VND vao  →  \\+?(\\d[\\d\\s.,]*)([A-Z]{3})  захватывает 2,674,000"
gotcha = "Знак минус выносим из захвата: -?(\\d[\\d\\s.,]*), иначе -73.66 не совпадёт с value=73.66. Не добавляйте хвостовой .* или пунктуацию — валидатор равенства не пропустит."

[[snippet]]
group = "amount"
kind = "alt"
pattern = '(\d[\d\s.,]*[.,]\d{2})'
desc = "Сумма с обязательными двумя знаками после разделителя. Жёсткий конец [.,]\\d{2} не даёт захватить лишнее."
trigger = "Сумма всегда с 2 знаками после разделителя и/или нужна точная правая граница (сразу за суммой — не-пробельный токен или ещё цифры)."

[[snippet]]
group = "amount"
kind = "alt"
pattern = '(\d[\d\s.,]*(?:[.,]\d{2})?)'
desc = "Сумма с аккуратной десятичной границей, но копейки опциональны."
trigger = "Нужна точная десятичная граница, но копейки в шаблоне бывают и отсутствуют."

# ─── Баланс (balance, av_balance) ───

[[snippet]]
group = "balance"
kind = "default"
pattern = '(-?\d[\d\s.,]*[.,]\d{2})'
desc = "Баланс: допускает минус (баланс бывает отрицательным), обязательные 2 знака, жёсткий конец отрезает хвост (время, валюту, точку)."
trigger = "Баланс почти всегда с копейками."
example = "Dostupno: 66.26, USD  →  Dostupno:\\s*(-?\\d[\\d\\s.,]*[.,]\\d{2})\\s*,  захватывает 66.26"
gotcha = "Если за балансом сразу идёт время (9141.03 15:43) — обязательно [.,]\\d{2} или граница (?=\\s|$|,), иначе в баланс утечёт время."

[[snippet]]
group = "balance"
kind = "alt"
pattern = '(-?\d[\d\s.,]*)'
desc = "Баланс без принудительных центов."
trigger = "Баланс в шаблоне бывает целым, или разделитель/точность плавают."

# ─── Валюта (instrument, acc_instrument, op_instrument) ───

[[snippet]]
group = "currency"
kind = "default"
pattern = '([A-Z]{3})'
desc = "Валюта: ISO-код из 3 латинских букв (USD, VND, RUB)."
trigger = "Валюта в SMS — ISO-код (≈85% свежих форматов)."
example = "2,808,259VND.  →  ([A-Z]{3})  захватывает VND"
gotcha = "Порядок «валюта перед суммой» (Rs 15.00) — группа валюты идёт в regex до группы суммы, строго по порядку токенов в SMS."

[[snippet]]
group = "currency"
kind = "alt"
pattern = '(\S+)'
desc = "Короткий символ или не-ISO токен валюты, отделённый пробелом ($, Rs, ₸)."
trigger = "Валюта — символ/короткий код, ограниченный пробелом."

[[snippet]]
group = "currency"
kind = "alt"
pattern = '(\S)'
desc = "Ровно один символ валюты (₽, $, ₴)."
trigger = "Символ валюты ровно один."

[[snippet]]
group = "currency"
kind = "alt"
pattern = '(.+?)'
desc = "Не-ISO валюта с явным разделителем (формулировка промпт-гайда)."
trigger = "Не-ISO валюта, ограниченная реальным разделителем из SMS. На практике чаще берут (\\S+)/(\\S) — обе формы допустимы."

# ─── Идентификатор счёта/карты (syncid, syncid#cash) ───

[[snippet]]
group = "syncid"
kind = "default"
pattern = '(\d{4})'
desc = "Последние 4 цифры нашего идентификатора (не контрагента). Якорим по маске."
trigger = "Дефолт (≈90% свежих)."
gotcha = "В одном SMS максимум один syncid (или один syncid#cash). Карта контрагента (на карту **** 4567) — НЕ syncid. Для снятия/внесения наличных та же группа, но колонка syncid#cash."

[[snippet]]
group = "syncid"
kind = "default"
pattern = '\*{2,4}(\d{4})'
desc = "4 цифры после маски из звёздочек (*1234, **5678, ***2771)."
trigger = "id замаскирован звёздочками слева."
example = "Karta *1877.  →  Karta\\s+\\*(\\d{4})  захватывает 1877"

[[snippet]]
group = "syncid"
kind = "default"
pattern = '\d{4}\*{3}(\d{4})'
desc = "Последние 4 цифры после BIN и маски (4318***2771 → 2771)."
trigger = "В SMS видны и первые, и последние цифры через маску."

[[snippet]]
group = "syncid"
kind = "alt"
pattern = '(\d+)'
desc = "Идентификатор-номер целиком, длина не фиксирована."
trigger = "id — короткий номер целиком."

[[snippet]]
group = "syncid"
kind = "alt"
pattern = '(\d{3,4})'
desc = "Идентификатор из 3 или 4 цифр."
trigger = "В шаблоне встречается и 3, и 4 цифры."

[[snippet]]
group = "syncid"
kind = "alt"
pattern = '(?:\*\*(\d{4}))?'
desc = "Необязательный id: при отсутствии группа вернёт пустое, что совпадёт с пустым value."
trigger = "id иногда отсутствует."

# ─── Дата операции (date#<order>) ───

[[snippet]]
group = "date"
kind = "default"
pattern = '(\d{2}[-./]\d{2}[-./]\d{2,4})'
desc = "Дата день-месяц-год (колонка date#dMy). Разделитель -, . или /; год 2 или 4 цифры."
trigger = "Дефолт: порядок день-месяц-год."
example = "16-05-2026 04:14  →  (\\d{2}-\\d{2}-\\d{4})  под date#dMy (время остаётся вне группы)"
gotcha = "Время (HH:mm[:ss]) всегда вне группы даты. Дата расписания/следующего списания/срока — НЕ дата операции, не захватываем."

[[snippet]]
group = "date"
kind = "alt"
pattern = '(\d{4}-\d{2}-\d{2})'
desc = "ISO-дата год-месяц-день (колонка date#yMd)."
trigger = "ISO-формат вида 2026-05-16."

[[snippet]]
group = "date"
kind = "alt"
pattern = '(\d{2}/\d{2}/\d{2,4})'
desc = "Дата месяц-день-год, US-порядок (колонка date#Mdy)."
trigger = "Порядок месяц-день-год."

[[snippet]]
group = "date"
kind = "alt"
pattern = '(\d{2}[./]\d{2})'
desc = "Дата без года (колонка date#dM или date#Md)."
trigger = "В дате нет года."

[[snippet]]
group = "date"
kind = "alt"
pattern = '(\d{2}[-. ][A-Za-z]{3}[-. ]\d{2,4})'
desc = "Дата с текстовым месяцем (17-Mar-25, колонка date#dMy)."
trigger = "Месяц записан буквами."

# ─── Получатель / контрагент (payee) ───

[[snippet]]
group = "payee"
kind = "default"
pattern = '(.+?)'
desc = "Нежадный захват получателя до явного разделителя."
trigger = "Дефолт (≈80% свежих). Всегда ограничивайте справа реальным якорем/разделителем из SMS."
gotcha = "Без правого якоря .+? схватит соседнюю сущность. Канал/банк-посредник (через СБП из Альфа Банк) — не payee."

[[snippet]]
group = "payee"
kind = "alt"
pattern = '([^,]+?)'
desc = "Получатель до запятой."
trigger = "Граница — запятая."
example = "mesto ATM ALTA IGUMAN, dana  →  mesto\\s+([^,]+?),"

[[snippet]]
group = "payee"
kind = "alt"
pattern = '([^"]+)'
desc = "Получатель внутри кавычек."
trigger = "Имя в двойных кавычках."
example = "\"NICE577P>Seoul\"  →  \"([^\"]+)\""

[[snippet]]
group = "payee"
kind = "alt"
pattern = '([A-Z\s]+?)'
desc = "Получатель из заглавных букв до ключевого слова."
trigger = "Граница — следующее ключевое слово."
example = "([A-Z\\s]+?)(?=\\s+chuyen tien)"

# ─── Комментарий (comment) ───

[[snippet]]
group = "comment"
kind = "default"
pattern = '(.+?)'
desc = "Нежадный захват комментария с правым якорем или привязкой к ключевому полю сообщения, реально присутствующему в SMS."
trigger = "Переменный пользовательский текст или выделенное поле сообщения."
example = "Сообщение:\\s*(.+?)$   либо   Комментар\\w*:\\s*(.+)"
gotcha = "НЕ тащите в comment стабильные якорные слова операции (Покупка, Оплата, Отмена операции, Перевод)."

# ─── MCC (mcc) ───

[[snippet]]
group = "mcc"
kind = "default"
pattern = '(\d+)'
desc = "Код категории мерчанта — целое число по якорю из SMS."
trigger = "В SMS есть якорь вида MCC 5411."

# ─── Склейка и якоря ───

[[snippet]]
group = "glue"
kind = "default"
pattern = '\s+'
desc = "Один или несколько пробелов между токенами."
trigger = "Между токенами есть пробел. Не хардкодьте одиночный пробел."

[[snippet]]
group = "glue"
kind = "default"
pattern = '.*?'
desc = "Нежадная склейка между якорями. Переносы строк уже схлопнуты в пробел, точка их перешагивает."
trigger = "Соединение между двумя надёжными якорями."

[[snippet]]
group = "glue"
kind = "alt"
pattern = '.*'
desc = "Голая жадная склейка."
trigger = "Допустима, когда дальше есть надёжный якорь."

[[snippet]]
group = "glue"
kind = "alt"
pattern = '.*?'
desc = "Пропуск лишнего токена между сущностью и её правым якорем — токена, который не идёт ни в одну колонку (дубликат валюты символ+ISO, служебное слово). Без группы захвата: проглатывается, но не захватывается."
trigger = "Между сущностью и якорем стоит не-сущностный токен. Ставим после узкой группы сущности ((\\S+)) перед якорем, чтобы группа не растянулась на лишний токен."
example = "325,69 kr SEK balance:  →  (\\S+).*?balance:  валюта = kr, SEK проглатывается без захвата"

[[snippet]]
group = "glue"
kind = "default"
pattern = '\s*'
desc = "Опциональный пробел между токенами."
trigger = "Пробел может отсутствовать."

[[snippet]]
group = "glue"
kind = "alt"
pattern = '\d{2}:\d{2}(?::\d{2})?'
desc = "Время HH:mm[:ss] как якорь/склейка, без группы захвата — время не сущность, в группу не попадает. Форма-сохраняющий литерал, ловит и 18:38:20, и 18:38."
trigger = "За датой идёт время, которое нужно проглотить, а не захватить. Альтернатива — ленивая .*? до следующего надёжного якоря."
example = "2026-05-26 18:38:20;  →  (\\d{4}-\\d{2}-\\d{2})\\s+\\d{2}:\\d{2}(?::\\d{2})?\\s*;  дата захвачена, время вне группы"
