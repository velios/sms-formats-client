# =============================================================================
# PRODUCTION INVENTORY TEMPLATE
# =============================================================================
# 1) Copy this file:
#    cp ansible/inventory/production.yml ansible/inventory/production.local.yml
# 2) Set your real VPS IP in ansible_host
# 3) Keep production.local.yml local-only (it is gitignored)
# =============================================================================

all:
  children:
    production:
      hosts:
        sms-formats-vps:
          ansible_host: YOUR_VPS_IP_HERE
          ansible_port: 22
          ansible_user: vpsuser
          ansible_python_interpreter: /usr/bin/python3
      vars:
        frontend_deploy_base_path: /var/www/sms-formats-client
        frontend_owner: www-data
        frontend_group: www-data
        bot_deploy_dir: /opt/sms-formats-bot
        bot_service_user: vpsuser
        bot_service_name: sms-formats-bot
