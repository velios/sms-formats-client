---
- name: Resolve deploy settings
  set_fact:
    bot_deploy_dir_resolved: "{{ bot_deploy_dir | default('/opt/sms-formats-bot') }}"
    bot_service_user_resolved: "{{ bot_service_user | default('smsbot') }}"
    bot_service_name_resolved: "{{ bot_service_name | default('sms-formats-bot') }}"

- name: Check local bot binary exists
  stat:
    path: "{{ playbook_dir }}/../../dist-bot/sms-formats-bot"
  register: local_binary
  delegate_to: localhost
  become: no

- name: Fail if binary is missing
  fail:
    msg: "dist-bot/sms-formats-bot not found. Build first: bun run bot:build"
  when: not local_binary.stat.exists

- name: Check local bot/.env exists
  stat:
    path: "{{ playbook_dir }}/../../bot/.env"
  register: local_env
  delegate_to: localhost
  become: no

- name: Fail if bot/.env is missing
  fail:
    msg: "bot/.env not found. Copy bot/.env.example to bot/.env and fill secrets."
  when: not local_env.stat.exists

- name: Ensure git is installed (bot clones the corpus on first boot)
  package:
    name: git
    state: present

- name: Create bot service user
  user:
    name: "{{ bot_service_user_resolved }}"
    system: yes
    create_home: no
    shell: /usr/sbin/nologin
  when: bot_service_user_resolved != ansible_user

- name: Ensure deploy directory exists
  file:
    path: "{{ bot_deploy_dir_resolved }}"
    state: directory
    owner: "{{ bot_service_user_resolved }}"
    group: "{{ bot_service_user_resolved }}"
    mode: "0750"

- name: Upload bot binary
  copy:
    src: "{{ playbook_dir }}/../../dist-bot/sms-formats-bot"
    dest: "{{ bot_deploy_dir_resolved }}/sms-formats-bot"
    owner: "{{ bot_service_user_resolved }}"
    group: "{{ bot_service_user_resolved }}"
    mode: "0750"
  notify: Restart bot

- name: Upload bot environment file (secrets, 0600)
  copy:
    src: "{{ playbook_dir }}/../../bot/.env"
    dest: "{{ bot_deploy_dir_resolved }}/.env"
    owner: "{{ bot_service_user_resolved }}"
    group: "{{ bot_service_user_resolved }}"
    mode: "0600"
  notify: Restart bot

- name: Install systemd unit
  template:
    src: sms-formats-bot.service.j2
    dest: "/etc/systemd/system/{{ bot_service_name_resolved }}.service"
    mode: "0644"
  notify:
    - Reload systemd
    - Restart bot

- name: Enable and start bot service
  systemd:
    name: "{{ bot_service_name_resolved }}"
    enabled: yes
    state: started
    daemon_reload: yes
