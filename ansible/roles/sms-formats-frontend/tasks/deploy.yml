---
- name: Resolve deploy settings
  set_fact:
    frontend_deploy_base_path_resolved: "{{ frontend_deploy_base_path | default('/var/www/sms-formats-client') }}"
    frontend_owner_resolved: "{{ frontend_owner | default('www-data') }}"
    frontend_group_resolved: "{{ frontend_group | default('www-data') }}"

- name: Check local dist exists
  stat:
    path: "{{ playbook_dir }}/../../dist"
  register: local_dist
  delegate_to: localhost
  become: no

- name: Fail if dist is missing
  fail:
    msg: "dist/ not found. Build first: bun run build"
  when: not local_dist.stat.exists

- name: Create local temp dir for artifact
  tempfile:
    state: directory
  register: local_temp_dir
  delegate_to: localhost
  become: no

- name: Create frontend tar.gz from local dist
  archive:
    path: "{{ playbook_dir }}/../../dist/*"
    dest: "{{ local_temp_dir.path }}/frontend.tar.gz"
    format: gz
  delegate_to: localhost
  become: no

- name: Ensure remote deploy directories exist
  file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ frontend_owner_resolved }}"
    group: "{{ frontend_group_resolved }}"
    mode: "0755"
  loop:
    - { path: "{{ frontend_deploy_base_path_resolved }}" }
    - { path: "{{ frontend_deploy_base_path_resolved }}/current" }
    - { path: "{{ frontend_deploy_base_path_resolved }}/previous" }

- name: Backup current to previous
  shell: |
    set -eu
    rm -rf "{{ frontend_deploy_base_path_resolved }}/previous"
    mkdir -p "{{ frontend_deploy_base_path_resolved }}/previous"
    if [ -d "{{ frontend_deploy_base_path_resolved }}/current" ]; then
      cp -a "{{ frontend_deploy_base_path_resolved }}/current/." "{{ frontend_deploy_base_path_resolved }}/previous/" || true
    fi
  args:
    executable: /bin/bash

- name: Clear current directory
  file:
    path: "{{ frontend_deploy_base_path_resolved }}/current"
    state: absent

- name: Recreate current directory
  file:
    path: "{{ frontend_deploy_base_path_resolved }}/current"
    state: directory
    owner: "{{ frontend_owner_resolved }}"
    group: "{{ frontend_group_resolved }}"
    mode: "0755"

- name: Upload frontend archive to remote tmp
  copy:
    src: "{{ local_temp_dir.path }}/frontend.tar.gz"
    dest: "/tmp/sms-formats-client-frontend.tar.gz"
    mode: "0644"

- name: Extract frontend archive
  unarchive:
    src: "/tmp/sms-formats-client-frontend.tar.gz"
    dest: "{{ frontend_deploy_base_path_resolved }}/current"
    remote_src: yes
    owner: "{{ frontend_owner_resolved }}"
    group: "{{ frontend_group_resolved }}"

- name: Remove remote tmp archive
  file:
    path: "/tmp/sms-formats-client-frontend.tar.gz"
    state: absent

- name: Remove local temp dir
  file:
    path: "{{ local_temp_dir.path }}"
    state: absent
  delegate_to: localhost
  become: no
